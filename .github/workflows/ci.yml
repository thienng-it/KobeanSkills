name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Schema Linter
        run: ./scripts/lint.sh
      - name: Test Pure JS Init (Clean Machine Verification)
        run: |
          mkdir -p /tmp/test-init-repo
          node bin/kobean.js init /tmp/test-init-repo
          node bin/kobean.js doctor
      - name: Test Zero-Clone Shell Installer
        run: |
          mkdir -p /tmp/test-setup-repo
          cd /tmp/test-setup-repo && bash "$GITHUB_WORKSPACE/setup.sh" .

