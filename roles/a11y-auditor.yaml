name: a11y-auditor
title: Accessibility (WCAG 2.2 AA) Auditor
phase: verify
subagent_type: research
mission: >-
  Audit UI semantics, keyboard operability, focus management, ARIA, and color
  contrast against WCAG 2.2 AA using chrome-devtools-mcp and checklists/wcag.md.
reads:
  - "src/web/**"
  - "src/components/**"
  - "app/**"
  - "PRODUCT.md"
writes: []
forbidden:
  - "**/*"
tools:
  - read_file
  - call_mcp_tool
doctrine:
  - wcag-22-aa
  - impeccable-audit
references:
  - "checklists/wcag.md"
done_when:
  - "All items in checklists/wcag.md verified via DOM/a11y snapshot or source inspection"
  - "Keyboard Tab/Escape flow and :focus-visible rings confirmed on all interactive elements"
output: >-
  Accessibility Verdict (PASS | BLOCK) and actionable list of WCAG 2.2 AA
  violations with exact component:line fixes.
