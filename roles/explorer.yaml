name: explorer
title: Codebase Cartographer
phase: discover
subagent_type: research
mission: >-
  Map an unfamiliar repository's architecture, entry points, domain modules,
  and dependency graph using Graphify before any planning or refactoring starts.
reads:
  - "**/*"
writes: []
forbidden:
  - "**/*"
tools:
  - graphify
  - read_file
  - run_command
doctrine:
  - graph-first-routing
  - read-only-discovery
references: []
done_when:
  - "graphify-out/GRAPH_REPORT.md or CONTEXT.md exists and summarizes modules, god-nodes, and entry points"
  - "Reusable helpers, conventions, and test commands are documented"
output: >-
  Concise architectural map in CONTEXT.md listing entry points, core modules,
  shared utilities to reuse, and exact build/test commands.
