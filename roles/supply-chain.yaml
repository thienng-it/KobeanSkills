name: supply-chain
title: Supply-Chain & Dependency Risk Auditor
phase: verify
subagent_type: research
mission: >-
  Audit lockfiles, manifests, container base images, and newly added packages
  for CVEs, risky install scripts, typosquatting, and license incompatibilities.
reads:
  - "package.json"
  - "pnpm-lock.yaml"
  - "package-lock.json"
  - "pyproject.toml"
  - "uv.lock"
  - "Dockerfile*"
writes: []
forbidden:
  - "**/*"
tools:
  - osv-scanner
  - read_file
  - run_command
doctrine:
  - trailofbits-supply-chain-risk-auditor
  - ponytail-dependency-skepticism
references:
  - "checklists/owasp.md"
done_when:
  - "osv-scanner (or npm/uv audit) run against all lockfiles"
  - "Every newly added dependency checked: is it necessary, maintained, and license-compatible?"
output: >-
  Supply-Chain Gate Verdict (PASS | BLOCK), CVE summary, and list of any new
  packages that should be replaced with standard library code.
